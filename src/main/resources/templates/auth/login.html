<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<section class="auth-wrap">
    <div class="auth-card reveal">
        <h2>Sign in</h2>

        <p class="alert error" th:if="${param.error}">Invalid email or password.</p>
        <p class="alert error" th:if="${param.blocked}">Too many failed attempts. Please try again in about 15 minutes.</p>
        <p class="alert ok" th:if="${param.registered}">Account created — please sign in.</p>
        <p class="alert ok" th:if="${param.loggedout}">You've been signed out.</p>

        <form th:action="@{/auth/login}" method="post">
            <label>Email <input type="email" name="username" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button class="btn btn-primary" type="submit">Sign in</button>
        </form>

        <p class="auth-alt">No account?
            <a th:href="@{/auth/register}">Create one</a></p>

        <p class="demo-hint">Demo admin: <code>admin@example.com / admin123</code><br>
            Demo customer: <code>demo@example.com / demo123</code></p>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
