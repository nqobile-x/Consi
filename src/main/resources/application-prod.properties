# =====================================================================
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# Datasource + admin credentials come from environment variables only.
# =====================================================================

# --- Supabase / PostgreSQL datasource (values injected as env vars) ---
# On Supabase: Project → Settings → Database → Connection string (JDBC).
# Use the connection POOLER host (port 6543) for serverless-style hosts.
# Render's managed DB injects DB_HOST/DB_PORT/DB_NAME; the URL is built from them.
# Set DATABASE_URL directly instead to point at any other Postgres (e.g. Supabase).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# 'update' keeps the schema in sync for this template. For a real production
# system, switch to 'validate' and manage schema with Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# --- Security hardening (prod) ---
store.security.h2-console-enabled=false
store.seed-demo-data=false
server.servlet.session.cookie.secure=true

# First admin is created from these (set them in the host's env, then you may
# unset the password var after first boot). If unset, no admin is auto-created.
store.admin.email=${ADMIN_EMAIL:}
store.admin.password=${ADMIN_PASSWORD:}

# --- Templates cached in prod ---
spring.thymeleaf.cache=true

# --- Honour Render's proxy headers (real client IP + https) ---
# Needed so the login rate limiter keys on the visitor's IP, not the proxy's.
server.forward-headers-strategy=framework

# --- Never leak internals ---
server.error.include-stacktrace=never
server.error.include-message=never
