spring.application.name=iconsi-store

# --- Brand (change these to rebrand the whole storefront) ---
store.brand-name=ICONSI
store.tagline=Bold graphic tees, made in Joburg for the world.

# --- Security ---
# H2 console + its framing/CSRF exemptions are OFF unless explicitly enabled.
# This is a LOCAL-DEV convenience only. Never enable it in a deployed profile.
store.security.h2-console-enabled=true

# Demo catalogue + demo accounts (admin@example.com / demo@example.com).
# LOCAL DEV ONLY — the prod profile turns this off so no default creds ship.
store.seed-demo-data=true

# --- H2 in-memory database (data resets on restart) ---
spring.datasource.url=jdbc:h2:mem:store;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console (guarded by store.security.h2-console-enabled in SecurityConfig)
spring.h2.console.enabled=${store.security.h2-console-enabled}
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Error responses: never leak internals to the client (A10) ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Session cookie hardening (A07) ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true behind HTTPS in production (keep false for local http dev):
server.servlet.session.cookie.secure=false
